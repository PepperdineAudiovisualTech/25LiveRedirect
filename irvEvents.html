<div id="mango-viewport-irvine" style="width:100%; height:100%; overflow:hidden; position:relative; background:white;">
    <iframe id="trumba-frame-irvine" name="trumba-frame-irvine" style="width: 100%; height: 100%; border: none; position: absolute; top: 0px; left: 0px;" src="about:blank"></iframe>
</div>

<script>
(function() {
    const frame = document.getElementById('trumba-frame-irvine');
    if (!frame) return;
    const doc = frame.contentWindow.document;

    const trumbaHtml = `
    <!DOCTYPE html>
    <html>
    <head>
        <base target="_blank">
        <style>
            body { margin:0; padding:0; font-family:sans-serif; background:white; overflow:hidden; }
            .twHeader, .twHeaderRow, thead { position: sticky !important; top: 0 !important; background: white !important; z-index: 1000 !important; }
            .trumba-logo, .trumba-footer, .twNav, .twViewNav { display:none !important; }
        </style>
    </head>
    <body>
        <script type="text/javascript" src="//25livepub.collegenet.com/scripts/spuds.js"><\/script>
        <script type="text/javascript">
            $Trumba.addSpud({
                webName: "irvine-events-non-class",
                spudType: "main"
            });
        <\/script>
    </body>
    </html>`;

    doc.open();
    doc.write(trumbaHtml);
    doc.close();
})();
</script>
